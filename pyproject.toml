[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pgx-cyp450-prescriber-engine"
version = "2.0.0"
description = "PGx-Prescriber: CPIC Gene-Drug Guidelines & CYP450 Metabolizer Phenotype Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
dependencies = ["pydantic>=2.0,<3"]

[project.optional-dependencies]
server = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
pgx-cyp450-prescriber-engine = "pgx_cyp450_prescriber_agent.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/pgx-cyp450-prescriber-agent"
Repository = "https://github.com/abusuraihsakhri/pgx-cyp450-prescriber-agent"

[tool.setuptools]
py-modules = ["cli", "pgx_prescriber", "pgx_cyp450_prescriber_agent_app", "pgx_prescriber_app", "simulator", "enrichment"]

[tool.setuptools.packages.find]
include = ["agents*", "pgx_cyp450_prescriber_agent*"]
