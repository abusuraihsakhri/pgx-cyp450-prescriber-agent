name: Python tests and browser checks

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[server,test]"
      - name: Check Python syntax
        run: python -m compileall -q agents pgx_cyp450_prescriber_agent cli.py pgx_prescriber.py enrichment.py
      - name: Run test suite
        run: python -m pytest -q
      - name: Check browser JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path("web/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script[^>]*>(.*?)</script>", html, flags=re.DOTALL)
          assert len(scripts) == 1, "Expected one inline browser script"
          Path("/tmp/pgx-browser.js").write_text(scripts[0], encoding="utf-8")
          PY
          node --check /tmp/pgx-browser.js
          node tests/browser_smoke.js
      - name: Run CLI and API smoke checks
        run: |
          python cli.py audit --task-id CI-SYN-001 --target SYN-001 --primary 12 --secondary 3
          python -m pgx_cyp450_prescriber_agent.cli audit --case-id CI-SYN-002 --primary 12 --secondary 3
      - name: Build Docker image
        if: matrix.python-version == '3.12'
        run: docker build -t pgx-demo:ci .
      - name: Check dependency vulnerabilities
        if: matrix.python-version == '3.12'
        run: |
          python -m pip install pip-audit
          pip-audit --skip-editable
